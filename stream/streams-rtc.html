<body>
  <!-- Video.js Player -->
  <video id="video-player" class="video-js vjs-fill vjs-big-play-centered" controls playsinline></video>

  <!-- Video.js Library -->

  <script>
    // Stream source selection (multiple servers)
    // var servs = [
    //  "www.slashernew888.live/stream",
    // ];

    // var serv = servs[Math.floor(Math.random() * servs.length)];
    // var sources = [
    //   'https://' + serv + '/hls/stream.m3u8',
    //   "https://www.slashernew888.live/stream/hls/stream.m3u8",
    // ];

    // Stream source selection (multiple servers)
    
    var sources = [
      // "https://adistreamserver.live/stream/hls/stream.m3u8",
      "https://antmedia.adistreamserver.live:5443/WebRTCApp/streams/stream.m3u8"
    ];

    var currentSourceIndex = 0;

    // Initialize the Video.js player
    function initializePlayer(source) {
      var player = videojs('video-player', {
        techOrder: ["html5"],
        autoplay: true,
        controls: true,
        muted: true, // Set to mute for autoplay to work across most browsers
        sources: [{ src: source, type: 'application/x-mpegURL' }],
        responsive: true,
        fluid: true, // Ensures the player resizes with the container
      });

      // Error handling: switch to the next source on error
      player.on('error', function() {
        console.log('Error detected, switching to next source...');
        currentSourceIndex = (currentSourceIndex + 1) % sources.length;
        player.src({ type: 'application/x-mpegURL', src: sources[currentSourceIndex] });
        player.play(); // Automatically start playback on the next source
      });


      // You can also listen for 'ended' or 'stalled' events to trigger a reload
      player.on('stalled', function() {
          console.log('Stream stalled, attempting to reload...');
          player.load();
          player.play();
      });

      // You can also listen for 'ended' or 'stalled' events to trigger a reload
      player.on('ended', function() {
          console.log('Stream ended, attempting to reload...');
          player.load();
          player.play();
      });
    }

    // Initialize with the first source
    initializePlayer(sources[currentSourceIndex]);
  </script>
</body>
