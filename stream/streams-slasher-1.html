<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player - Clappr</title>
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@0.4.7/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/clappr/clappr-level-selector-plugin@latest/dist/level-selector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swarmcloud-hls@latest/dist/p2p-engine.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swarmcloud-hls@latest/dist/clappr-p2p-plugin.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
        }
        #player {
            width: 100%;
            height: 100%;
        }
        #unauthorized {
            display: none;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="player"></div>
    <div id="unauthorized"><h1>Redirecting to secure source...</h1></div>

    <script>
        /**
         * 1. DOMAIN SECURITY LOGIC (Same as original)
         */
        (function checkAccess() {
            var referrer = document.referrer;
            var currentDomain = window.location.hostname;
            var allowedDomains = [
                'localhost', '127.0.0.1', '128.199.103.91',
                'www.luckyslasher2025.live', 'www.slashernew888.live',
                'www.sabongslasher2026.live', 'www.internationalslasher.live',
                'worldcockfightingarena.live', 'sabongslasher2026.live',
                'swc4site.live', 'wpc183.live'
            ];

            var targetDomain = "";
            if (referrer) {
                try {
                    targetDomain = new URL(referrer).hostname;
                } catch(e) {
                    targetDomain = "";
                }
            } else {
                targetDomain = currentDomain;
            }

            if (!allowedDomains.includes(targetDomain)) {
                document.getElementById('player').style.display = 'none';
                document.getElementById('unauthorized').style.display = 'block';
                window.location.replace("https://www.youtube.com/embed/BjUn6pu74wc?autoplay=1");
            }
        })();

        /**
         * 2. CLAPPR INITIALIZATION
         */

        /**
            P2P & PLAYER CONFIGURATION
         */
        var p2pConfig = {
            live: true,
            announceLocation: 'hk' // Using Hong Kong per your source
        };

        // Initialize P2P Engine if supported
        if (P2pEngineHls.isMSESupported()) {
            new P2pEngineHls(p2pConfig);
        }
        
        var player = new Clappr.Player({
            source: 'https://adislasherstr2026.live:3334/app/stream/llhls.m3u8', // Default source
            parentId: '#player',
            autoPlay: true,
            mute: true,
            width: '100%',
            height: '100%',
            hlsjsConfig: {
                enableLowLatencyVjs: true,
                liveSyncDurationCount: 3,
                maxBufferLength: 4,
                p2pConfig: p2pConfig
            },
            playback: {
                playInline: true,
                recycleVideo: true,
            },
            events: {
                onError: function(error) {
                    console.error('Clappr Error:', error);
                    // Reconnection logic
                    setTimeout(function() {
                        console.log('Attempting to reconnect...');
                        player.configure({
                            source: 'https://adislasherstr2026.live:3334/app/stream/llhls.m3u8'
                        });
                        player.play();
                    }, 5000);
                }
            }
        });
        

    /**
     * 3. ANTI-DEBUGGER PROTECTION
     */
    (function() {
        (function a() {
            try {
                (function b(i) {
                    if (('' + (i / i)).length !== 1 || i % 20 === 0) {
                        (function() { }).constructor('debugger')();
                    } else {
                        debugger;
                    }
                    b(++i);
                })(0);
            } catch (e) {
                setTimeout(a, 100);
            }
        })();
    })();
    </script>
</body>
</html>
